<style>

<body>
<div id="app"><main id="view"></main></div>
<nav id="tabbar"></nav>
<div id="modal-root"></div>
<div id="toast"></div>
<script>
"use strict";

// ===== ENGINE START =====
// 纯计算层：不依赖 DOM，可被 tests.mjs 提取做回归测试。
// 口径以《Attention Portfolio 0.1 Development Baseline》为准：
// Weekly Load 用 Wt（Planned Effort This Week）；任务总规模用 Ht（Remaining Effort）；0 ≤ Wt ≤ Ht。

const CONSEQUENCE_LEVELS = [
  { value: 0, key: "flexible", label: "可延期", desc: "基本没影响，可以以后做" },
  { value: 0.33, key: "slows", label: "拖慢进度", desc: "会拖慢项目" },
  { value: 0.67, key: "affects", label: "影响他人", desc: "会影响下一步或其他人" },
  { value: 1, key: "hard", label: "硬性截止", desc: "硬性承诺，必须按时完成" },
];

function parseDateStr(s) {
  const parts = String(s).split("-").map(Number);
  return new Date(parts[0], parts[1] - 1, parts[2]);
}

// daysLeft：日历日差（今天为 0）；hoursLeft：到截止日当天 23:59:59 的小时数
function deadlineInfo(task, now = new Date()) {
  if (!task.deadline) return { has: false, daysLeft: null, hoursLeft: null, isOverdue: false, within72h: false };
  const dl = parseDateStr(task.deadline);
  const todayMid = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const daysLeft = Math.round((dl - todayMid) / 86400000);
  const eod = new Date(dl.getFullYear(), dl.getMonth(), dl.getDate(), 23, 59, 59, 999);
  const hoursLeft = (eod - now) / 3600000;
  return { has: true, daysLeft, hoursLeft, isOverdue: daysLeft < 0, within72h: hoursLeft >= 0 && hoursLeft <= 72 };
}

function deadlinePressure(task, now = new Date()) {
  const d = deadlineInfo(task, now);
  if (!d.has) return 0;
  if (d.isOverdue) return 1;
  if (d.daysLeft <= 1) return 1;
  if (d.daysLeft <= 3) return 0.75;
  if (d.daysLeft <= 7) return 0.5;
  if (d.daysLeft <= 14) return 0.25;
  return 0.1;
}

function taskUrgency(task, now = new Date()) {
  return (deadlinePressure(task, now) + (Number(task.consequence) || 0)) / 2;
}

const STATE_MATRIX = {
  Low: { Low: "ACTIVE", Moderate: "ACTIVE", High: "ACTIVE", Critical: "HEAVY" },
  Moderate: { Low: "ACTIVE", Moderate: "ACTIVE", High: "HEAVY", Critical: "BURNING" },
  High: { Low: "HEAVY", Moderate: "HEAVY", High: "BURNING", Critical: "BURNING" },
  "Very High": { Low: "HEAVY", Moderate: "BURNING", High: "BURNING", Critical: "BURNING" },
};

function computeProject(project, tasks, capacity, now = new Date()) {
  const mine = tasks.filter(t => t.projectId === project.id && !t.completed);
  const planned = mine.filter(t => (Number(t.plannedThisWeek) || 0) > 0);
  const Hw = mine.reduce((s, t) => s + (Number(t.plannedThisWeek) || 0), 0);
  const Htotal = mine.reduce((s, t) => s + (Number(t.remainingEffort) || 0), 0);
  const urg = planned.map(t => ({ t, u: taskUrgency(t, now) }));
  const weightedU = Hw > 0 ? urg.reduce((s, x) => s + (Number(x.t.plannedThisWeek) || 0) * x.u, 0) / Hw : null;
  const peakU = urg.length ? Math.max(...urg.map(x => x.u)) : null;
  const L = capacity > 0 ? Hw / capacity : 0;
  const workloadBand = Hw === 0 ? null : L < 0.15 ? "Low" : L < 0.30 ? "Moderate" : L < 0.50 ? "High" : "Very High";
  const urgencyBand = weightedU === null ? null : weightedU < 0.25 ? "Low" : weightedU < 0.50 ? "Moderate" : weightedU < 0.75 ? "High" : "Critical";
  const state = Hw === 0 ? "DORMANT" : STATE_MATRIX[workloadBand][urgencyBand];
  // DDL 风险统计：不要求 Wt > 0（R3：DDL 风险独立于本周计划存在）
  let d72 = 0, overdue = 0, hardNear = 0;
  for (const t of mine) {
    if ((Number(t.consequence) || 0) < 0.33) continue;
    const d = deadlineInfo(t, now);
    if (!d.has) continue;
    if (d.isOverdue) overdue++;
    else if (d.within72h) { d72++; if ((Number(t.consequence) || 0) >= 1) hardNear++; }
  }
  const immediateIds = urg.filter(x => x.u >= 0.75).map(x => x.t.id);
  const unplannedIds = mine
    .filter(t => (Number(t.plannedThisWeek) || 0) === 0 && (Number(t.consequence) || 0) >= 0.33 && deadlinePressure(t, now) >= 0.75)
    .map(t => t.id);
  return { id: project.id, name: project.name, archived: !!project.archived, Hw, Htotal, L, weightedU, peakU, workloadBand, urgencyBand, state, d72, overdue, hardNear, immediateIds, unplannedIds, activeCount: mine.length };
}

function computePortfolio(projects, tasks, capacity, now = new Date()) {
  const live = projects.filter(p => !p.archived);
  const active = tasks.filter(t => !t.completed && live.some(p => p.id === t.projectId));
  const computed = live.map(p => computeProject(p, active, capacity, now));
  const totalW = computed.reduce((s, p) => s + p.Hw, 0);
  const Lp = capacity > 0 ? totalW / capacity : 0;
  const withWork = computed.filter(p => p.Hw > 0);
  const A = withWork.length;
  const totalHw = withWork.reduce((s, p) => s + p.Hw, 0);
  const shares = A > 0 ? withWork.map(p => p.Hw / totalHw).sort((a, b) => b - a) : [];
  const Pmax = shares.length ? shares[0] : 0;
  const Ptop2 = shares.length ? shares[0] + (shares[1] || 0) : 0;
  let F = 0;
  if (A > 1) {
    const H = -shares.reduce((s, p) => s + p * Math.log(p), 0);
    F = H / Math.log(A);
  }
  const B = computed.filter(p => p.state === "BURNING").length;
  let D72 = 0, Doverdue = 0;
  for (const t of active) {
    if ((Number(t.consequence) || 0) < 0.33) continue;
    const d = deadlineInfo(t, now);
    if (!d.has) continue;
    if (d.isOverdue) Doverdue++;
    else if (d.within72h) D72++;
  }
  // 决策树：按序判定，命中即停（同一输入唯一输出）
  let status;
  if (B >= 3 || (B >= 2 && Lp >= 0.80) || (Lp > 1.00 && (Ptop2 < 0.70 || D72 >= 3 || Doverdue >= 1))) status = "BURNING OUT";
  else if (Lp >= 0.60 && Lp <= 1.00 && B <= 1 && (Pmax >= 0.65 || Ptop2 >= 0.80) && D72 <= 1 && Doverdue === 0) status = "FOCUSED";
  else if (Lp >= 0.80 || (Lp >= 0.60 && Ptop2 < 0.80) || B === 2 || D72 >= 2 || Doverdue >= 1) status = "LOADED";
  else status = "CLEAR";
  // Severity Bands：从 3 向 0 扫描，取最高命中档
  const sevOver = Lp > 1.20 ? 3 : Lp > 1.00 ? 2 : Lp >= 0.80 ? 1 : 0;
  const sevConc = B >= 3 ? 3 : B === 2 ? 2 : B === 1 ? 1 : 0;
  let sevDead = 0;
  if (Doverdue >= 2 || (Doverdue >= 1 && D72 >= 2)) sevDead = 3;
  else if ((Doverdue === 0 && D72 >= 3) || Doverdue >= 1) sevDead = 2;
  else if (Doverdue === 0 && D72 === 2) sevDead = 1;
  let sevFrag = 0;
  if (Lp > 1.00 && Ptop2 < 0.70) sevFrag = 3;
  else if (Lp >= 0.80 && Ptop2 < 0.70) sevFrag = 2;
  else if (Lp >= 0.60 && Ptop2 < 0.80) sevFrag = 1;
  // tie-break：Concurrent Urgency -> Over-allocation -> Deadline -> Fragmentation
  const PRESSURES = [
    { key: "Concurrent Urgency", sev: sevConc, zh: "并行紧迫", desc: "多个项目同时 BURNING，多场硬仗并行" },
    { key: "Over-allocation", sev: sevOver, zh: "总量超配", desc: "总工作量超过本周可支配时间" },
    { key: "Deadline Concentration", sev: sevDead, zh: "截止集中", desc: "多个有实际后果的任务在 72h 内集中到期" },
    { key: "Fragmentation", sev: sevFrag, zh: "注意力分散", desc: "中高负荷下精力散布在多个项目，上下文切换压力大" },
  ];
  const maxSev = Math.max(sevOver, sevConc, sevDead, sevFrag);
  const pressure = maxSev === 0
    ? { key: null, zh: "无明显压力", desc: "各维度均无显著压力", sev: 0 }
    : PRESSURES.find(p => p.sev === maxSev);
  return {
    projects: computed, totalW, Lp, A, Pmax, Ptop2, F, B, D72, Doverdue,
    status, pressure, severity: { over: sevOver, conc: sevConc, deadline: sevDead, fragmentation: sevFrag },
  };
}

// 周标识：本周周一的日期字符串（YYYY-MM-DD）
function weekIdOf(date = new Date()) {
  const d = new Date(date.getFullYear(), date.getMonth(), date.getDate());
  const day = (d.getDay() + 6) % 7;
  d.setDate(d.getDate() - day);
  const p = n => String(n).padStart(2, "0");
  return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
}

// 输入校验：0 ≤ Wt ≤ Ht
function clampPlanned(Ht, Wt) {
  return Math.max(0, Math.min(Number(Wt) || 0, Number(Ht) || 0));
}

// 新周规则（R2 周计划快照）：未完成任务保留，Wt 清零，Capacity 沿用
function applyWeekRollover(state, currentWeekId) {
  if (state.weekId === currentWeekId) return { state, changed: false };
  const tasks = state.tasks.map(t => (t.completed || !(Number(t.plannedThisWeek) > 0)) ? t : { ...t, plannedThisWeek: 0 });
  return { state: { ...state, tasks, weekId: currentWeekId, newWeekNotice: true }, changed: true };
}

// ---------- To-do 视图计算（纯函数） ----------
// 日期串统一为本地时区 YYYY-MM-DD，字典序即时间序。
// 口径：DDL 只有日期 -> 日视图是"到期账本"；Wt 是周粒度 -> 日级衍生量只有"周剩余 ÷ 剩余天数"。

function dateStrOf(d) {
  const p = n => String(n).padStart(2, "0");
  return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
}

function addDaysStr(s, n) {
  const d = parseDateStr(s);
  d.setDate(d.getDate() + n);
  return dateStrOf(d);
}

function weekStartStr(s) {
  const d = parseDateStr(s);
  d.setDate(d.getDate() - (d.getDay() + 6) % 7);
  return dateStrOf(d);
}

function shiftMonthStr(s, n) {
  const d = parseDateStr(s);
  return dateStrOf(new Date(d.getFullYear(), d.getMonth() + n, 1));
}

// 日视图分桶（互斥，按序判定）：逾期 / 今天 / 72h 内 / 更远
function todoBuckets(tasks, now = new Date()) {
  const res = { overdue: [], today: [], soon: [], future: [] };
  for (const t of tasks) {
    if (t.completed || !t.deadline) continue;
    const d = deadlineInfo(t, now);
    if (!d.has) continue;
    if (d.isOverdue) res.overdue.push(t);
    else if (d.daysLeft === 0) res.today.push(t);
    else if (d.within72h) res.soon.push(t);
    else res.future.push(t);
  }
  return res;
}

// 周/月视图分组：[from, to] 闭区间内按 DDL 日期聚合（仅未完成、有 DDL）
function groupByDeadline(tasks, fromStr, toStr) {
  const g = {};
  for (const t of tasks) {
    if (t.completed || !t.deadline) continue;
    if (t.deadline < fromStr || t.deadline > toStr) continue;
    (g[t.deadline] = g[t.deadline] || []).push(t);
  }
  return g;
}

// DDL 墙判定（待办口径）：单周 DDL ≥ 3、单日 DDL ≥ 2、或 72h 内有 DDL，任一命中即为墙。
// 逾期不计入 72h 口径（逾期另有红色标记通道）。
function wallInfo(tasks, now = new Date()) {
  const weeks = {};
  const days = {};
  for (const t of tasks) {
    if (t.completed || !t.deadline) continue;
    const d = deadlineInfo(t, now);
    if (!d.has) continue;
    const ws = weekStartStr(t.deadline);
    const w = weeks[ws] = weeks[ws] || { start: ws, count: 0, dayMax: 0, near72: 0, reasons: [], wall: false };
    w.count++;
    const day = days[t.deadline] = days[t.deadline] || { count: 0, hot: false, overdue: false };
    day.count++;
    if (d.isOverdue) day.overdue = true;
    else if (d.within72h) { day.hot = true; w.near72++; }
  }
  for (const ws in weeks) {
    const w = weeks[ws];
    for (const ds in days) {
      if (weekStartStr(ds) === ws && days[ds].count > w.dayMax) w.dayMax = days[ds].count;
    }
    if (w.count >= 3) w.reasons.push("单周 " + w.count + " 个 DDL");
    if (w.dayMax >= 2) w.reasons.push("单日最多 " + w.dayMax + " 个");
    if (w.near72 > 0) w.reasons.push("72h 内 " + w.near72 + " 个");
    w.wall = w.reasons.length > 0;
  }
  return { weeks, days };
}
// ===== ENGINE END =====

function defaultState() {
  return {
    version: 1,
    settings: { capacity: 24 },
    weekId: weekIdOf(),
    newWeekNotice: false,
    projects: [],
    tasks: [],
    createdAt: new Date().toISOString(),
  };
}

function loadState() {
  let raw = null;
  try { raw = localStorage.getItem(LS_KEY); } catch (e) { /* localStorage 不可用 */ }
  let s = null;
  if (raw) { try { s = JSON.parse(raw); } catch (e) { s = null; } }
  if (!s || !Array.isArray(s.projects) || !Array.isArray(s.tasks)) s = defaultState();
  if (!s.settings || !(Number(s.settings.capacity) > 0)) s.settings = { capacity: 24 };
  const rol = applyWeekRollover(s, weekIdOf());
  if (rol.changed) { s = rol.state; persist(s); }
  return s;
}

function persist(s) {
  try { localStorage.setItem(LS_KEY, JSON.stringify(s)); } catch (e) { toast("保存失败：浏览器存储不可用"); }
}
function save() { persist(state); }

// ---------- Why-this-state ----------
function projectWhy(p) {
  if (p.state === "DORMANT") {
    let s = "本周没有计划投入（Wt = 0），项目处于休眠。";
    if (p.unplannedIds.length) s += " 但存在 " + p.unplannedIds.length + " 个未排入本周的临近 DDL。";
    return s;
  }
  const parts = [];
  parts.push("占本周 Capacity " + pct(p.L) + "（" + p.workloadBand + " Workload）");
  parts.push("加权紧迫度 " + p.weightedU.toFixed(2) + "（" + p.urgencyBand + " Urgency）");
  if (p.d72 > 0) parts.push(p.d72 + " 个 72h 内有后果的 DDL");
  if (p.overdue > 0) parts.push(p.overdue + " 个已逾期");
  if (p.immediateIds.length) parts.push("⚡ " + p.immediateIds.length + " 个 Immediate Task");
  if (p.unplannedIds.length) parts.push("⚠ " + p.unplannedIds.length + " 个 Unplanned Deadline");
  return parts.join(" · ");
}

function portfolioWhy(pf) {
  if (pf.status === "BURNING OUT") {
    if (pf.B >= 3) return pf.B + " 个项目同时 BURNING（B ≥ 3）";
    if (pf.B >= 2 && pf.Lp >= 0.8) return pf.B + " 个项目 BURNING 且负荷 " + pct(pf.Lp) + "（B ≥ 2 且 Lp ≥ 80%）";
    return "负荷 " + pct(pf.Lp) + " 超过 Capacity，且伴随结构性压力（分散或 DDL 集中）";
  }
  if (pf.status === "FOCUSED") return "负荷 " + pct(pf.Lp) + "，精力集中（Top-2 占 " + pct(pf.Ptop2) + "），Burning ≤ 1，无 DDL / Overdue 冲突";
  if (pf.status === "LOADED") {
    const t = [];
    if (pf.Lp >= 0.8) t.push("负荷 " + pct(pf.Lp));
    else if (pf.Lp >= 0.6 && pf.Ptop2 < 0.8) t.push("中高负荷且分散（Top-2 仅 " + pct(pf.Ptop2) + "）");
    if (pf.B === 2) t.push("2 个项目 BURNING");
    if (pf.D72 >= 2) t.push(pf.D72 + " 个 72h 内有后果的 DDL");
    if (pf.Doverdue >= 1) t.push(pf.Doverdue + " 个已逾期");
    return t.join("，") || "压力升高";
  }
  return "负荷轻（" + pct(pf.Lp) + "），无并行燃烧，无明显近期 DDL 冲突";
}

  const pf = computePortfolio(state.projects, state.tasks, C);
  const p = pf.projects.find(x => x.id === projectId)
    || computeProject(project, state.tasks.filter(t => !t.completed), C);
  const m = projStateMeta(p.state);
  const tasks = state.tasks.filter(t => t.projectId === projectId);
  const unfinished = tasks.filter(t => !t.completed).sort((a, b) => taskUrgency(b) - taskUrgency(a));
  const done = tasks.filter(t => t.completed);
  const flags = [];
  if (p.immediateIds.length) flags.push('<span class="flag flag-hot">⚡ ' + p.immediateIds.length + " Immediate Task</span>");
  if (p.unplannedIds.length) flags.push('<span class="flag flag-hot">⚠ ' + p.unplannedIds.length + " Unplanned Deadline</span>");
  if (p.d72) flags.push('<span class="flag">' + p.d72 + " 个 DDL &lt; 72h</span>");
  if (p.overdue) flags.push('<span class="flag flag-hot">' + p.overdue + " 个已逾期</span>");
  if (p.peakU !== null) flags.push('<span class="flag">Peak Urgency ' + p.peakU.toFixed(2) + "</span>");
  return '<div class="view-head">'
    + '<button class="btn-ghost" data-action="back">← 返回</button>'
    + '<div class="head-actions">'
    + '<button class="btn-mini" data-action="edit-project" data-id="' + project.id + '">编辑</button>'
    + (project.archived
      ? '<button class="btn-mini" data-action="unarchive-project" data-id="' + project.id + '">恢复</button>'
      : '<button class="btn-mini" data-action="archive-project" data-id="' + project.id + '">归档</button>')
    + '<button class="btn-mini danger" data-action="del-project" data-id="' + project.id + '">删除</button>'
    + "</div></div>"
    + '<div class="eyebrow">PROJECT</div>'
    + '<div class="state-big sm" style="color:' + m.color + '">' + esc(project.name) + " · " + p.state + "</div>"
    + (project.description ? '<div class="muted" style="margin-top:2px">' + esc(project.description) + "</div>" : "")
    + (project.archived ? '<div class="arch-banner">已归档：不参与本周 Portfolio 计算。</div>' : "")
    + '<div class="card"><div class="eyebrow">WHY THIS STATE</div><div class="why-text">' + esc(projectWhy(p)) + "</div></div>"
    + '<div class="statgrid">'
    + '<div class="stat"><b>' + fmtH(p.Hw) + 'h</b><span>本周计划 Wt</span></div>'
    + '<div class="stat"><b>' + pct(p.L) + '</b><span>占 Capacity</span></div>'
    + '<div class="stat"><b>' + fmtH(p.Htotal) + 'h</b><span>剩余总量 Ht</span></div>'
    + '<div class="stat"><b>' + p.activeCount + "</b><span>未完成任务</span></div>"
    + "</div>"
    + (flags.length ? '<div class="flags">' + flags.join("") + "</div>" : "")
    + '<button class="btn-primary" data-action="add-task">＋ 添加任务</button>'
    + '<div class="eyebrow lg">TASKS · 未完成 ' + unfinished.length + "</div>"
    + '<div class="card list">'
    + (unfinished.length ? unfinished.map(t => taskRowHTML(t)).join("") : '<div class="empty">没有未完成任务</div>')
    + "</div>"
    + (done.length
      ? '<div class="eyebrow lg">已完成 ' + done.length + "</div>"
      + '<div class="card list">' + done.map(t => taskRowHTML(t)).join("") + "</div>"
      : "");
}

function deadlineChip(t, d) {
  if (!d.has) return "";
  if (d.isOverdue) return '<span class="tag tag-hot">逾期 ' + (-d.daysLeft) + " 天</span>";
  if (d.daysLeft === 0) return '<span class="tag tag-hot">今天到期</span>';
  if (d.daysLeft === 1) return '<span class="tag tag-hot">明天到期</span>';
  if (d.daysLeft <= 3) return '<span class="tag tag-warm">' + d.daysLeft + " 天后</span>";
  return '<span class="tag">' + fmtDateShort(t.deadline) + "</span>";
}

function taskRowHTML(t) {
  const u = taskUrgency(t);
  const d = deadlineInfo(t);
  const cons = CONSEQUENCE_LEVELS.find(c => Math.abs(c.value - (Number(t.consequence) || 0)) < 0.001);
  const meta = ['<span class="tnum">本周 ' + fmtH(t.plannedThisWeek) + "h</span>", '<span class="tnum">剩余 ' + fmtH(t.remainingEffort) + "h</span>"];
  meta.push(deadlineChip(t, d));
  if ((Number(t.consequence) || 0) >= 0.33 && cons) meta.push('<span class="tag">' + esc(cons.label) + "</span>");
  if (!t.completed && (Number(t.plannedThisWeek) || 0) > 0 && u >= 0.75) meta.push('<span class="tag tag-hot">⚡ Immediate</span>');
  if (!t.completed && (Number(t.plannedThisWeek) || 0) === 0 && (Number(t.consequence) || 0) >= 0.33 && deadlinePressure(t) >= 0.75) meta.push('<span class="tag tag-hot">⚠ Unplanned</span>');
  return '<div class="trow' + (t.completed ? " done" : "") + '">'
    + '<button class="check' + (t.completed ? " on" : "") + '" data-action="toggle-task" data-id="' + t.id + '" aria-label="完成">' + (t.completed ? "✓" : "") + "</button>"
    + '<div class="tmain" data-action="edit-task" data-id="' + t.id + '">'
    + '<div class="tname">' + esc(t.name) + "</div>"
    + '<div class="tmeta">' + meta.join("") + "</div>"
    + "</div>"
    + '<button class="tdel" data-action="del-task" data-id="' + t.id + '" aria-label="删除">×</button>'
    + "</div>";
}

function settingsHTML() {
  return '<div class="eyebrow">SETTINGS</div>'
    + '<h2 class="page-title">设置</h2>'
    + '<div class="card">'
    + '<label class="f">Weekly Capacity（本周可用于项目的总时间，小时）'
    + '<input id="cap-live" type="number" min="1" max="168" step="0.5" inputmode="decimal" value="' + state.settings.capacity + '">'
    + '<span class="hint">修改后实时生效，全部诊断立即重算。</span></label>'
    + "</div>"
    + '<div class="card">'
    + '<div class="card-title">数据备份</div>'
    + '<p class="muted">数据仅保存在本设备浏览器（localStorage），不上传任何服务器。可用 JSON 导出 / 导入做迁移与备份。</p>'
    + '<div class="btn-row">'
    + '<button class="btn-ghost" data-action="export">导出 JSON</button>'
    + '<button class="btn-ghost" data-action="import">导入 JSON</button>'
    + "</div>"
    + '<input type="file" id="import-file" accept=".json,application/json" hidden>'
    + "</div>"
    + '<div class="card danger-zone">'
    + '<div class="card-title">清空数据</div>'
    + '<p class="muted">删除全部项目、任务与设置，不可恢复。建议先导出备份。</p>'
    + '<div class="btn-row"><button class="btn-mini danger" data-action="wipe">删除全部数据</button></div>'
    + "</div>"
    + '<div class="about">'
    + "<b>Attention Portfolio 0.1</b><br>"
    + "Attention / Project Load Diagnosis · 非医学或心理学诊断工具<br>"

    + state.projects.length + " 个项目 · " + state.tasks.length + " 个任务 · 当前周 " + state.weekId
    + "</div>";
}

// ---------- To-do 视图（DDL 账本：同一份任务数据的时间轴投影，零新增输入） ----------
const WD_ZH = ["日", "一", "二", "三", "四", "五", "六"];
const weekdayZh = s => WD_ZH[parseDateStr(s).getDay()];
const byUtDesc = (x, y) => (taskUrgency(y) - taskUrgency(x)) || (x.deadline < y.deadline ? -1 : x.deadline > y.deadline ? 1 : 0);

function liveTasks() {
  const live = new Set(state.projects.filter(p => !p.archived).map(p => p.id));
  return state.tasks.filter(t => !t.completed && live.has(t.projectId));
}

function todoFooterStats(now) {
  const live = new Set(state.projects.filter(p => !p.archived).map(p => p.id));
  let doneToday = 0, noDate = 0;
  for (const t of state.tasks) {
    if (!live.has(t.projectId)) continue;
    if (t.completed) {
      if (t.completedAt) {
        const d = new Date(t.completedAt);
        if (d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth() && d.getDate() === now.getDate()) doneToday++;
      }
    } else if (!t.deadline) noDate++;
  }
  return { doneToday, noDate };
}

function todoSection(title, list, hot) {
  if (!list.length) return "";
  return '<div class="eyebrow lg' + (hot ? " hot" : "") + '">' + esc(title) + "</div>"
    + '<div class="card list">' + list.map(t => taskRowHTML(t)).join("") + "</div>";
}

function todoNav(dir) {
  const today = dateStrOf(new Date());
  const anchor = todoUI.anchor || today;
  if (todoUI.view === "month") todoUI.anchor = shiftMonthStr(anchor, dir);
  else todoUI.anchor = addDaysStr(anchor, dir * (todoUI.view === "week" ? 7 : 1));
}

function todoHTML() {
  const now = new Date();
  const today = dateStrOf(now);
  const anchor = todoUI.anchor || today;
  const v = todoUI.view;
  const seg = '<div class="vseg">' + [["day", "日"], ["week", "周"], ["month", "月"]].map(x =>
    '<button data-action="todo-view" data-view="' + x[0] + '" class="' + (v === x[0] ? "on" : "") + '">' + x[1] + "</button>").join("") + "</div>";
  const body = v === "week" ? todoWeekHTML(anchor, now, today) : v === "month" ? todoMonthHTML(anchor, now, today) : todoDayHTML(anchor, now, today);
  return '<div class="view-head"><div class="eyebrow">TO-DO · DDL 账本</div>'
    + '<div class="head-actions">'
    + (anchor !== today ? '<button class="btn-ghost" data-action="todo-today">回今天</button>' : "")
    + '<button class="btn-mini" data-action="add-task">＋ 任务</button></div></div>'
    + seg + body;
}

function todoDayHTML(anchor, now, today) {
  const b = todoBuckets(liveTasks(), now);
  const overdue = b.overdue.slice().sort(byUtDesc);
  const isToday = anchor === today;
  // 看过去的日期时，当天的未完成任务必然已逾期，只保留逾期桶，避免重复
  const dayTasks = anchor >= today ? liveTasks().filter(t => t.deadline === anchor).sort(byUtDesc) : [];
  const soon = isToday ? b.soon.slice().sort((x, y) => (deadlineInfo(x, now).daysLeft - deadlineInfo(y, now).daysLeft) || byUtDesc(x, y)) : [];
  const p = anchor.split("-").map(Number);
  let out = '<div class="cal-head"><div class="cal-title">' + (isToday ? "今天 · " : "") + p[1] + " 月 " + p[2] + " 日 · 周" + weekdayZh(anchor) + "</div>"
    + '<div class="cal-nav">'
    + '<button class="btn-mini" data-action="todo-nav" data-dir="-1">‹ 前一天</button>'
    + '<button class="btn-mini" data-action="todo-nav" data-dir="1">后一天 ›</button></div></div>';
  out += todoSection("已逾期 " + overdue.length, overdue, true);
  out += todoSection((isToday ? "今天到期 " : fmtDateShort(anchor) + " 到期 ") + dayTasks.length, dayTasks, false);
  if (isToday) out += todoSection("72h 内到期 " + soon.length, soon, false);
  out += weekPaceStrip(anchor, today);
  if (!overdue.length && !dayTasks.length && !soon.length) {
    const near = b.future.slice().sort((x, y) => (x.deadline < y.deadline ? -1 : 1))[0];
    out += '<div class="card"><div class="empty">' + (isToday ? "今天没有到期任务" : "这一天没有到期任务")
      + (near ? "<br>最近的 DDL：" + fmtDateShort(near.deadline) + " · " + esc(near.name) : "") + "</div></div>";
  }
  const st = todoFooterStats(now);
  out += '<div class="diag-note">✓ 今日已完成 ' + st.doneToday + " · 无日期任务 " + st.noDate + "（不进日历）</div>";
  return out;
}

function weekPaceStrip(anchor, today) {
  if (weekStartStr(anchor) !== weekStartStr(today)) return "";
  const live = new Set(state.projects.filter(p => !p.archived).map(p => p.id));
  const remW = state.tasks.filter(t => !t.completed && live.has(t.projectId))
    .reduce((s, t) => s + (Number(t.plannedThisWeek) || 0), 0);
  if (!(remW > 0)) return "";
  const daysLeft = 7 - ((parseDateStr(today).getDay() + 6) % 7);
  return '<div class="pace-strip">本周剩余 <b>' + fmtH(remW) + "h</b> ÷ 剩 " + daysLeft + " 天 ≈ <b>" + fmtH(remW / daysLeft) + "h/天</b></div>";
}

function todoWeekHTML(anchor, now, today) {
  const tasks = liveTasks();
  const monday = weekStartStr(anchor);
  const isCurrent = weekStartStr(today) === monday;
  const grouped = groupByDeadline(tasks, monday, addDaysStr(monday, 6));
  const wall = wallInfo(tasks, now);
  const overdue = todoBuckets(tasks, now).overdue.slice().sort(byUtDesc);
  const weekDdl = Object.keys(grouped).reduce((s, k) => s + grouped[k].length, 0);
  const chips = [];
  if (overdue.length) chips.push('<span class="chip chip-hot">逾期 ' + overdue.length + "</span>");
  chips.push('<span class="chip">本周 DDL ' + weekDdl + "</span>");
  if (isCurrent) {
    const pfv = computePortfolio(state.projects, state.tasks, state.settings.capacity);
    chips.push('<span class="chip ' + (pfv.Lp >= 0.8 ? "chip-warm" : "") + '">本周负荷 ' + pct(pfv.Lp) + "</span>");
  }
  let strip = "";
  for (let i = 0; i < 7; i++) {
    const ds = addDaysStr(monday, i);
    const c = (grouped[ds] || []).length;
    const info = wall.days[ds];
    let cntCls = "wk-cnt";
    if (info && (info.overdue || info.hot)) cntCls += " hot";
    else if (c >= 2) cntCls += " warm";
    strip += '<button class="wk-day' + (ds === today ? " today" : "") + '" data-action="todo-day" data-date="' + ds + '">'
      + '<span class="wd">' + WD_ZH[(i + 1) % 7] + '</span><span class="dn">' + Number(ds.slice(8, 10)) + '</span>'
      + '<span class="' + cntCls + '">' + (c > 0 ? c : "·") + "</span></button>";
  }
  const wk = wall.weeks[monday];
  let agenda = "";
  if (isCurrent) agenda += todoSection("已逾期 " + overdue.length, overdue, true);
  for (const ds of Object.keys(grouped).sort()) {
    // 本周视图里逾期任务已单独置顶，逐日分组里不再重复
    const items = (isCurrent ? grouped[ds].filter(t => !deadlineInfo(t, now).isOverdue) : grouped[ds]).slice().sort(byUtDesc);
    if (!items.length) continue;
    agenda += todoSection((ds === today ? "今天 · " : "") + "周" + weekdayZh(ds) + " " + fmtDateShort(ds) + " · " + items.length + " 个", items, false);
  }
  const st = todoFooterStats(now);
  return '<div class="cal-head"><div class="cal-title">' + fmtDateShort(monday) + " – " + fmtDateShort(addDaysStr(monday, 6)) + (isCurrent ? " · 本周" : "") + "</div>"
    + '<div class="cal-nav">'
    + '<button class="btn-mini" data-action="todo-nav" data-dir="-1">‹ 前一周</button>'
    + '<button class="btn-mini" data-action="todo-nav" data-dir="1">后一周 ›</button></div></div>'
    + '<div class="chips">' + chips.join("") + "</div>"
    + '<div class="wk-strip">' + strip + "</div>"
    + (wk && wk.wall ? '<div class="wall-banner">⚠ DDL 墙 · ' + wk.reasons.join(" · ") + "</div>" : "")
    + (agenda || '<div class="card"><div class="empty">这一周没有到期任务</div></div>')
    + '<div class="diag-note">✓ 今日已完成 ' + st.doneToday + " · 无日期任务 " + st.noDate + "（不进日历）</div>";
}

function todoMonthHTML(anchor, now, today) {
  const wall = wallInfo(liveTasks(), now);
  const y = Number(anchor.slice(0, 4)), m = Number(anchor.slice(5, 7));
  const first = dateStrOf(new Date(y, m - 1, 1));
  const last = dateStrOf(new Date(y, m, 0));
  const gridStart = weekStartStr(first);
  let cells = "";
  for (let i = 0; i < 42; i++) {
    const ds = addDaysStr(gridStart, i);
    const inMonth = ds.slice(5, 7) === anchor.slice(5, 7);
    const info = wall.days[ds];
    const c = info ? info.count : 0;
    const wk = wall.weeks[weekStartStr(ds)];
    const cls = ["cal-cell"];
    if (!inMonth) cls.push("out");
    else {
      if (wk && wk.wall) cls.push("wallweek");
      if (info && info.count >= 2) cls.push("daywall");
    }
    if (ds === today) cls.push("tday");
    if (c > 0) cls.push("has");
    const pipCls = info && (info.overdue || info.hot) ? "pip hot" : info && info.count >= 2 ? "pip warm" : "pip";
    const pips = c > 0 ? '<span class="pips">' + (c > 3 ? '<span class="pip-n">' + c + "</span>"
      : Array.from({ length: c }, () => '<span class="' + pipCls + '"></span>').join("")) + "</span>" : "";
    cells += '<button class="' + cls.join(" ") + '"' + (c > 0 ? ' data-action="todo-day" data-date="' + ds + '"' : "") + ">"
      + "<span>" + Number(ds.slice(8, 10)) + "</span>" + pips + "</button>";
  }
  const notes = Object.keys(wall.weeks).filter(ws => wall.weeks[ws].wall && ws <= last && addDaysStr(ws, 6) >= first).sort()
    .map(ws => '<div class="wall-note">⚠ ' + fmtDateShort(ws) + " – " + fmtDateShort(addDaysStr(ws, 6)) + "：" + wall.weeks[ws].reasons.join("，") + "</div>")
    .join("");
  const st = todoFooterStats(now);
  return '<div class="cal-head"><div class="cal-title">' + y + " 年 " + m + " 月</div>"
    + '<div class="cal-nav">'
    + '<button class="btn-mini" data-action="todo-nav" data-dir="-1">‹ 前一月</button>'
    + '<button class="btn-mini" data-action="todo-nav" data-dir="1">后一月 ›</button></div></div>'
    + '<div class="cal-grid">' + ["一", "二", "三", "四", "五", "六", "日"].map(w => '<div class="cal-wd">' + w + "</div>").join("") + cells + "</div>"
    + notes
    + lookaheadHTML(now, today)
    + '<div class="diag-note">无日期任务 ' + st.noDate + "（不进日历）· 点有标记的日期看当天</div>";
}

function lookaheadHTML(now, today) {
  const wall = wallInfo(liveTasks(), now);
  const end = addDaysStr(today, 60);
  const rows = [];
  let total = 0, wallWeeks = 0;
  for (let ws = weekStartStr(today); ws <= end; ws = addDaysStr(ws, 7)) {
    const w = wall.weeks[ws];
    if (!w) continue;
    total += w.count;
    if (w.wall) wallWeeks++;
    rows.push('<div class="lk-row' + (w.wall ? " wall" : "") + '" data-action="todo-week" data-date="' + ws + '">'
      + '<span class="lk-date">' + fmtDateShort(ws) + " – " + fmtDateShort(addDaysStr(ws, 6)) + "</span>"
      + '<span class="lk-cnt">' + w.count + " 个 DDL</span>"
      + (w.wall ? '<span class="tag tag-warm">墙</span>' : "") + "</div>");
  }
  const head = '<div class="eyebrow lg">FUTURE 60 DAYS · 远期摘要</div>';
  if (!rows.length) return head + '<div class="card"><div class="empty">未来 60 天没有已排期的 DDL</div></div>';
  return head + '<div class="card list">' + rows.slice(0, 9).join("")
    + (rows.length > 9 ? '<div class="empty">… 其余 ' + (rows.length - 9) + " 周</div>" : "")
    + '<div class="lk-total">共 ' + total + " 个 DDL · " + wallWeeks + " 周触发墙预警 · 点周可跳转</div></div>";
}

// ---------- Modals ----------
function openModal(inner) {
  $("#modal-root").innerHTML = '<div class="backdrop" data-action="close-modal"></div><div class="sheet">' + inner + "</div>";
  document.body.style.overflow = "hidden";
}
function closeModal() {
  $("#modal-root").innerHTML = "";
  document.body.style.overflow = "";
}

function openTaskForm(taskId, presetProjectId) {
  const t = taskId ? state.tasks.find(x => x.id === taskId) : null;
  const keepId = t ? t.projectId : presetProjectId;
  const projects = state.projects.filter(p => !p.archived || p.id === keepId);
  if (!projects.length) { toast("请先创建一个项目"); openProjectForm(); return; }
  const cur = t || { name: "", projectId: presetProjectId || projects[0].id, remainingEffort: 2, plannedThisWeek: null, deadline: null, consequence: 0, completed: false };
  const cons = Number(t ? t.consequence : 0);
  openModal('<h3 class="m-title">' + (t ? "编辑任务" : "新增任务") + "</h3>"
    + '<form id="task-form" novalidate>'
    + '<label class="f">任务名称<input name="name" maxlength="60" placeholder="例如：完成联调" value="' + esc(cur.name) + '"></label>'
    + (presetProjectId ? "" : '<label class="f">所属项目<select name="projectId">'
      + projects.map(p => '<option value="' + p.id + '"' + (p.id === cur.projectId ? " selected" : "") + ">" + esc(p.name) + "</option>").join("")
      + "</select></label>")
    + '<div class="grid2">'
    + '<label class="f">剩余工时 Ht（h）<input name="remainingEffort" id="f-ht" type="number" min="0" step="0.5" inputmode="decimal" value="' + cur.remainingEffort + '"></label>'
    + '<label class="f">本周计划 Wt（h）<input name="plannedThisWeek" id="f-wt" type="number" min="0" step="0.5" inputmode="decimal" value="' + (cur.plannedThisWeek == null ? cur.remainingEffort : cur.plannedThisWeek) + '"></label>'
    + "</div>"
    + '<div class="hint">0 ≤ Wt ≤ Ht · 新任务默认 Wt = Ht · 新周 Wt 自动清零</div>'
    + '<label class="f">截止日期（可选）<input name="deadline" type="date" value="' + esc(cur.deadline || "") + '"></label>'
    + '<div class="f">延期后果'
    + '<div class="seg" id="cons-seg">'
    + CONSEQUENCE_LEVELS.map(c => '<button type="button" data-v="' + c.value + '" class="' + (Math.abs(c.value - cons) < 0.001 ? "on" : "") + '">' + c.label + "</button>").join("")
    + "</div>"
    + '<input type="hidden" name="consequence" value="' + cons + '">'
    + "</div>"
    + (t ? '<label class="f checkrow"><input type="checkbox" name="completed"' + (t.completed ? " checked" : "") + "> 已完成（完成后 Wt 置 0，不计入负荷）</label>" : "")
    + '<button class="btn-primary" type="submit">保存</button>'
    + "</form>");
  const form = $("#task-form");
  const seg = $("#cons-seg");
  const consInput = form.querySelector('[name="consequence"]');
  seg.addEventListener("click", e => {
    const b = e.target.closest("button");
    if (!b) return;
    consInput.value = b.dataset.v;
    seg.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
  });
  const ht = $("#f-ht"), wt = $("#f-wt");
  let wtTouched = !!t;
  wt.addEventListener("input", () => { wtTouched = true; });
  ht.addEventListener("input", () => { if (!wtTouched) wt.value = ht.value; });
  form.addEventListener("submit", e => {
    e.preventDefault();
    const fd = new FormData(form);
    const name = String(fd.get("name") || "").trim();
    if (!name) { toast("请填写任务名称"); return; }
    const projectId = presetProjectId || String(fd.get("projectId") || "") || projects[0].id;
    if (!state.projects.some(p => p.id === projectId)) { toast("项目不存在"); return; }
    const Ht = Math.max(0, parseFloat(fd.get("remainingEffort")) || 0);
    const WtIn = Math.max(0, parseFloat(fd.get("plannedThisWeek")) || 0);
    const completed = !!fd.get("completed");
    const deadline = String(fd.get("deadline") || "").trim() || null;
    const consequence = parseFloat(fd.get("consequence")) || 0;
    let Wt = clampPlanned(Ht, WtIn);
    const clamped = WtIn > Wt + 1e-9;
    if (completed) Wt = 0;
    if (t) Object.assign(t, { name, projectId, remainingEffort: Ht, plannedThisWeek: Wt, deadline, consequence, completed, completedAt: completed ? (t.completedAt || new Date().toISOString()) : null });
    else state.tasks.push({ id: uid(), name, projectId, remainingEffort: Ht, plannedThisWeek: Wt, deadline, consequence, completed, createdAt: new Date().toISOString() });
    save(); closeModal(); render();
    if (clamped) toast("本周计划已随剩余工作量下调至 " + fmtH(Wt) + "h");
  });
}

function openProjectForm(projectId) {
  const p = projectId ? state.projects.find(x => x.id === projectId) : null;
  openModal('<h3 class="m-title">' + (p ? "编辑项目" : "新建项目") + "</h3>"
    + '<form id="project-form" novalidate>'
    + '<label class="f">项目名称<input name="name" maxlength="40" placeholder="例如：Quant 研究" value="' + esc(p ? p.name : "") + '"></label>'
    + '<label class="f">说明（可选）<textarea name="description" rows="2" maxlength="120" placeholder="一句话即可">' + esc(p ? p.description || "" : "") + "</textarea></label>"
    + '<div class="hint">项目是长期对象，跨周复用；本周投入由任务的 Wt 自动求和，无需手动填写。</div>'
    + '<button class="btn-primary" type="submit">保存</button>'
    + "</form>");
  $("#project-form").addEventListener("submit", e => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const name = String(fd.get("name") || "").trim();
    if (!name) { toast("请填写项目名称"); return; }
    const description = String(fd.get("description") || "").trim();
    if (p) Object.assign(p, { name, description });
    else state.projects.push({ id: uid(), name, description, archived: false, createdAt: new Date().toISOString() });
    save(); closeModal(); render();
  });
}

function openCapacityForm() {
  openModal('<h3 class="m-title">Weekly Capacity</h3>'
    + '<p class="muted">本周现实中可用于个人项目的总时间。</p>'
    + '<form id="cap-form">'
    + '<label class="f">小时 / 周<input name="capacity" type="number" min="1" max="168" step="0.5" inputmode="decimal" required value="' + state.settings.capacity + '"></label>'
    + '<button class="btn-primary" type="submit">保存</button>'
    + "</form>");
  $("#cap-form").addEventListener("submit", e => {
    e.preventDefault();
    const v = parseFloat(new FormData(e.target).get("capacity"));
    if (!(v >= 1)) { toast("至少 1 小时"); return; }
    state.settings.capacity = Math.min(168, v);
    save(); closeModal(); render();
  });
}

// ---------- Actions ----------
function toggleTask(id) {
  const t = state.tasks.find(x => x.id === id);
  if (!t) return;
  t.completed = !t.completed;
  t.completedAt = t.completed ? new Date().toISOString() : null; // 记录完成当天，供待办视图"今日已完成"统计
  let msg = "";
  if (t.completed) {
    if ((Number(t.plannedThisWeek) || 0) > 0) msg = "已完成 · 本周计划已清零";
    t.plannedThisWeek = 0;
  }
  save(); render();
  if (msg) toast(msg);
}

function exportJSON() {
  try {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "attention-portfolio-" + new Date().toISOString().slice(0, 10) + ".json";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    toast("已导出 JSON 备份");
  } catch (e) { toast("导出失败"); }
}

function handleImport(input) {
  const f = input.files && input.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(String(r.result));
      if (!d || !Array.isArray(d.projects) || !Array.isArray(d.tasks)) throw new Error("bad");
      if (!confirm("导入将覆盖当前所有数据，继续？")) return;
      const base = defaultState();
      const merged = Object.assign({}, base, d, {
        settings: { capacity: (d.settings && Number(d.settings.capacity) >= 1) ? d.settings.capacity : base.settings.capacity },
      });
      delete merged.newWeekNotice;
      state = applyWeekRollover(merged, weekIdOf()).state;
      save(); render();
      toast("导入成功");
    } catch (e) { toast("导入失败：文件格式不正确"); }
  };
  r.readAsText(f);
  input.value = "";
}

function wipeData() {
  if (!confirm("确定清空所有项目、任务与设置？此操作不可恢复。")) return;
  try { localStorage.removeItem(LS_KEY); } catch (e) { /* ignore */ }
  state = defaultState();
  ui = { tab: "home", projectId: null };
  render();
  toast("已清空");
}

// ---------- Toast ----------
var toastTimer = null;
function toast(msg) {
  const el = $("#toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 2600);
}

// ---------- Events ----------
document.addEventListener("click", e => {
  const el = e.target.closest("[data-action]");
  if (!el) return;
  const a = el.dataset.action;
  const id = el.dataset.id;
  if (a === "tab") { ui = { tab: el.dataset.tab, projectId: null }; window.scrollTo(0, 0); render(); }
  else if (a === "open-project") { ui = { tab: "project", projectId: id, from: ui.tab === "projects" ? "projects" : "home" }; window.scrollTo(0, 0); render(); }
  else if (a === "back") { ui = { tab: ui.from === "projects" ? "projects" : "home", projectId: null }; render(); }
  else if (a === "add-task") openTaskForm(null, ui.tab === "project" ? ui.projectId : null);
  else if (a === "edit-task") openTaskForm(id);
  else if (a === "toggle-task") toggleTask(id);
  else if (a === "todo-view") { todoUI.view = el.dataset.view; render(); }
  else if (a === "todo-nav") { todoNav(Number(el.dataset.dir) || 0); render(); }
  else if (a === "todo-today") { todoUI.anchor = null; render(); }
  else if (a === "todo-day") { todoUI.view = "day"; todoUI.anchor = el.dataset.date; window.scrollTo(0, 0); render(); }
  else if (a === "todo-week") { todoUI.view = "week"; todoUI.anchor = el.dataset.date; window.scrollTo(0, 0); render(); }
  else if (a === "del-task") {
    const t = state.tasks.find(x => x.id === id);
    if (t && confirm("删除任务「" + t.name + "」？")) {
      state.tasks = state.tasks.filter(x => x.id !== id);
      save(); render();
    }
  }
  else if (a === "add-project") openProjectForm();
  else if (a === "edit-project") openProjectForm(id);
  else if (a === "archive-project") {
    const p = state.projects.find(x => x.id === id);
    if (p && confirm("归档项目「" + p.name + "」？归档后不参与本周计算，可随时恢复。")) {
      p.archived = true;
      if (ui.projectId === id) ui = { tab: ui.from === "projects" ? "projects" : "home", projectId: null };
      save(); render();
    }
  }
  else if (a === "unarchive-project") {
    const p = state.projects.find(x => x.id === id);
    if (p) { p.archived = false; save(); render(); }
  }
  else if (a === "del-project") {
    const p = state.projects.find(x => x.id === id);
    if (p && confirm("删除项目「" + p.name + "」及其全部任务？不可恢复。")) {
      state.projects = state.projects.filter(x => x.id !== id);
      state.tasks = state.tasks.filter(t => t.projectId !== id);
      if (ui.projectId === id) ui = { tab: ui.from === "projects" ? "projects" : "home", projectId: null };
      save(); render();
    }
  }
  else if (a === "edit-capacity") openCapacityForm();
  else if (a === "export") exportJSON();
  else if (a === "import") { const inp = $("#import-file"); if (inp) inp.click(); }
  else if (a === "wipe") wipeData();
  else if (a === "dismiss-week") { state.newWeekNotice = false; save(); render(); }
  else if (a === "close-modal") closeModal();
});

document.addEventListener("change", e => {
  if (e.target.id === "cap-live") {
    const v = parseFloat(e.target.value);
    if (v >= 1) { state.settings.capacity = Math.min(168, v); save(); render(); }
    else toast("至少 1 小时");
  }
  if (e.target.id === "import-file") handleImport(e.target);
});

// ---------- Boot ----------
render();
</script>
</body>
</html>
